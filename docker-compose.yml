services:
  dashboard:
    build: .
    command: [ "python", "-m", "harvey.cli", "dashboard", "--host", "0.0.0.0", "--port", "5555" ]
    env_file: .env
    ports:
      - "127.0.0.1:4070:5555"
    volumes:
      - ./data:/app/data
      - ./harvey.yaml:/app/harvey.yaml
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
    restart: unless-stopped
    init: true

  runner:
    build: .
    command: [ "python", "-m", "harvey.main" ]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./harvey.yaml:/app/harvey.yaml
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
    restart: unless-stopped
    init: true
