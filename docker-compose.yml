services:
  harvey:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      # Persist SQLite database and logs across restarts
      - ./data:/app/data
      # Mount config for live editing without rebuild
      - ./harvey.yaml:/app/harvey.yaml
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # Optional: Uncomment below only if using Claude Code subscription instead of Cloud API
      # - ~/.claude:/home/harvey/.claude
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
